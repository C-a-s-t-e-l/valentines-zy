<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ehehe</title>
    <link rel="icon" type="image/x-icon" href="/images/chikin.jpg">
    <link rel="stylesheet" href="wev.css">

</head>

<body id="movie-body">

    <div id="movie-container">
        <h2>Help me plan it? You pick, pookie</h2>
        <form onsubmit="sendEmail(event)">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" value="Bebi" required><br><br>

            <label>Choose a Movie:</label>
            <div class="dropdown-container">
                <div class="selected-option" onclick="toggleDropdown('movie-dropdown')">
                    <img id="selected-movie-img" src="/images/movie.gif" alt="">
                    <span id="selected-movie-text">Select a Movie</span>
                </div>
                <div class="dropdown-list" id="movie-dropdown">
                    <div class="dropdown-item" onclick="selectOption('movie', 'Valentines Day', '/images/v-day.gif')">
                        <img src="/images/v-day.gif" alt="">
                        <span>Valentine's Day</span>
                    </div>
                    <div class=" dropdown-item" onclick="selectOption('movie', 'Suzume', '/images/suzume.gif')">
                        <img src="/images/suzume.gif" alt="">
                        <span>Suzume | Suzume's Locking Up</span>
                    </div>
                    <div class="dropdown-item" onclick="selectOption('movie', 'Serendipity', '/images/seren.gif')">
                        <img src="/images/seren.gif" alt="">
                        <span>Serendipity</span>
                    </div>
                </div>
            </div>
            <input type="hidden" id="movie" name="movie">

            <br><br>

            <label>Choose a Food:</label>
            <div class="dropdown-container">
                <div class="selected-option" onclick="toggleDropdown('food-dropdown')">
                    <img id="selected-food-img" src="/images/food.gif" alt="">
                    <span id="selected-food-text">Select a Food</span>
                </div>
                <div class="dropdown-list" id="food-dropdown">
                    <div class="dropdown-item" onclick="selectOption('food', 'Pizza', '/images/pizza.gif')">
                        <img src="/images/pizza.gif" alt="">
                        <span>Pizza</span>
                    </div>
                    <div class="dropdown-item" onclick="selectOption('food', 'Donuts', '/images/donut.gif')">
                        <img src="/images/donut.gif" alt="">
                        <span>Donuts</span>
                    </div>
                    <div class="dropdown-item" onclick="selectOption('food', 'Ice Cream', '/images/cream.gif')">
                        <img src="/images/cream.gif" alt="">
                        <span>Ice Cream</span>
                    </div>
                </div>
            </div>
            <input type="hidden" id="food" name="food">

            <br><br>

            <label for="message">Other Preferences:</label><br>
            <textarea id="message" name="message" rows="4" cols="30"
                placeholder="Write here if you don't like the above options ;3;"></textarea><br><br>

            <div id="submit-btn">
                <button type="submit">💌 Order up! 💌</button>
            </div>
        </form>
    </div>
    <script src="audio.js"></script>
    <script>
        function sendEmail(event) {
            event.preventDefault();

            const name = document.getElementById("name").value;
            const movie = document.getElementById("movie").value;
            const food = document.getElementById("food").value;
            const message = document.getElementById("message").value;

            const subject = encodeURIComponent("Valentine's Choices from " + name);
            const body = encodeURIComponent(`${name} here, let's watch ${movie} and eat ${food}\nOther Preferences: ${message}`);

            const mailtoLink = `mailto:ezzyllena@gmail.com?subject=${subject}&body=${body}`;
            window.location.href = mailtoLink;
        }

        function toggleDropdown(id) {
            document.getElementById(id).style.display =
                document.getElementById(id).style.display === "block" ? "none" : "block";
        }

        function selectOption(type, text, img) {
            document.getElementById(`selected-${type}-text`).innerText = text;
            document.getElementById(`selected-${type}-img`).src = img;
            document.getElementById(type).value = text;
            document.getElementById(`${type}-dropdown`).style.display = "none";
        }
    </script>
</body>

</html>
